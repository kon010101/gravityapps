<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Gravity Apps</title>
    <meta
      name="description"
      content="Indie iOS apps, built simple. Gravity Apps — developer home and privacy policies."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Syne:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css" />
    <link rel="icon" href="assets/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" href="assets/favicon-32.png" sizes="32x32" />
    <link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />
  </head>
  <body>
    <header class="site-header">
      <div class="site-header__inner">
        <a class="wordmark" href="./">
          <img
            class="wordmark__mark"
            src="assets/gravityapps_mark.png"
            alt=""
            width="128"
            height="128"
          />
          <span class="wordmark__text">Gravity Apps</span>
        </a>
        <nav class="nav" aria-label="Primary">
          <a href="apps/">Apps</a>
          <a
            class="nav-support"
            href="https://buymeacoffee.com/gravityapps"
            target="_blank"
            rel="noopener noreferrer"
            >Support me</a
          >
        </nav>
      </div>
    </header>

    <main class="main">
      <section class="hero" aria-label="Intro">
        <h1 class="hero__brand">Gravity Apps</h1>
        <p class="hero__tagline">Indie iOS apps, built simple.</p>
        <div class="hero__cta">
          <a class="btn btn--primary" href="apps/">View apps</a>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="site-footer__inner">
        <p>&copy; <span id="year"></span> Gravity Apps</p>
      </div>
    </footer>

    <script src="js/main.js"></script>
    <script>
      document.getElementById("year").textContent = new Date().getFullYear();
    </script>
  </body>
</html>
